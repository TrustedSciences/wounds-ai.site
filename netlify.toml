# Netlify configuration for woundeye-ai.com
# Plain static site: no build step, Netlify publishes the repo root.

[build]
  publish = "."
  command = ""

# Force the www version of the domain (set www.woundeye-ai.com as primary in Netlify too)
[[redirects]]
  from = "https://woundeye-ai.com/*"
  to = "https://www.woundeye-ai.com/:splat"
  status = 301
  force = true

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-term caching for static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
